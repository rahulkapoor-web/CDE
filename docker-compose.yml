services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migration_bridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/migration_bridge
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/migration_bridge
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dGhpcyBpcyBhIGRldmVsb3BtZW50IGtleQ==}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      DEBUG: "true"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  celery-worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/migration_bridge
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/migration_bridge
      REDIS_URL: redis://redis:6379/0
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-dGhpcyBpcyBhIGRldmVsb3BtZW50IGtleQ==}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
