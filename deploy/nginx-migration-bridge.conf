server {
    listen 80;
    server_name rm2lvmbridge.mah.roche.com;

    # Redirect HTTP to HTTPS (uncomment when SSL cert is available)
    # return 301 https://$host$request_uri;

    # Frontend — serve built React app
    location / {
        root /opt/migration-bridge/frontend-dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API — proxy to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 50M;
    }

    # Backend docs
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/api/health;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/migration-bridge-access.log;
    error_log /var/log/nginx/migration-bridge-error.log;
}

