apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: migration-bridge
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: IMAGE_REGISTRY/migration-bridge-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/migration_bridge
            - name: DATABASE_URL_SYNC
              value: postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres:5432/migration_bridge
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: WORKERS
              value: "2"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-bridge-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: migration-bridge-secrets
                  key: SECRET_KEY
            - name: CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: migration-bridge-secrets
                  key: CREDENTIAL_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: migration-bridge
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
